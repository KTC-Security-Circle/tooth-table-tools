[project]
name = "tooth-turntable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nuitka>=4.1.3",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
build = "pio run -e uno_r4_wifi"
upload = "pio run -e uno_r4_wifi -t upload"
monitor = "pio device monitor"
flash = "task upload && task monitor"
clean = "pio run -e uno_r4_wifi -t clean"
sync = "uv sync"
install = "uv sync"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
move = "python scripts/turntable.py ${ANGLE}"
compile = "python -m nuitka --onefile --output-dir=dist --output-filename=turntable scripts/turntable.py"
all = "task build && task compile && task test && task lint"
